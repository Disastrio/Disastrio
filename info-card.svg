<svg xmlns="http://www.w3.org/2000/svg"
             width="420"
             height="220"
             viewBox="0 0 420 220">

          <rect
            width="100%"
            height="100%"
            rx="12"
            fill="#111111"/>

          <rect
            x="1"
            y="1"
            width="418"
            height="218"
            rx="12"
            fill="none"
            stroke="#333333"/>

          <rect
            x="0"
            y="0"
            width="420"
            height="36"
            rx="12"
            fill="#1c1c1c"/>

          <rect
            x="0"
            y="24"
            width="420"
            height="12"
            fill="#1c1c1c"/>

          <circle cx="18" cy="18" r="5" fill="#ff5f56"/>
          <circle cx="34" cy="18" r="5" fill="#ffbd2e"/>
          <circle cx="50" cy="18" r="5" fill="#27c93f"/>

          <text
            x="70"
            y="23"
            font-family="monospace"
            font-size="14"
            fill="#cccccc">neofetch</text>

          <style>
            .key {
              font-family: monospace;
              font-size: 14px;
              font-weight: 700;
              fill: #6fb3ff;
            }

            .value {
              font-family: monospace;
              font-size: 14px;
              fill: #dddddd;
            }
          </style>
        
            <g opacity="0">
              
              <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.00s"
                dur="0.35s"
                fill="freeze"/>

              <animateTransform
                attributeName="transform"
                type="translate"
                from="-12 0"
                to="0 0"
                begin="0.00s"
                dur="0.35s"
                fill="freeze"/>
            

              <text
                class="key"
                x="24"
                y="72">Now:</text>

              <text
                class="value"
                x="115"
                y="72">Building my GitHub profile</text>
            </g>
            
            <g opacity="0">
              
              <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.12s"
                dur="0.35s"
                fill="freeze"/>

              <animateTransform
                attributeName="transform"
                type="translate"
                from="-12 0"
                to="0 0"
                begin="0.12s"
                dur="0.35s"
                fill="freeze"/>
            

              <text
                class="key"
                x="24"
                y="110">Prev:</text>

              <text
                class="value"
                x="115"
                y="110">Learning Python &amp; Git</text>
            </g>
            
            <g opacity="0">
              
              <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.24s"
                dur="0.35s"
                fill="freeze"/>

              <animateTransform
                attributeName="transform"
                type="translate"
                from="-12 0"
                to="0 0"
                begin="0.24s"
                dur="0.35s"
                fill="freeze"/>
            

              <text
                class="key"
                x="24"
                y="148">Stack:</text>

              <text
                class="value"
                x="115"
                y="148">Python · GitHub · Linux</text>
            </g>
            
            <g opacity="0">
              
              <animate
                attributeName="opacity"
                from="0"
                to="1"
                begin="0.36s"
                dur="0.35s"
                fill="freeze"/>

              <animateTransform
                attributeName="transform"
                type="translate"
                from="-12 0"
                to="0 0"
                begin="0.36s"
                dur="0.35s"
                fill="freeze"/>
            

              <text
                class="key"
                x="24"
                y="186">Highlights:</text>

              <text
                class="value"
                x="115"
                y="186">Automation · ASCII · SVG</text>
            </g>
            </svg>